<!doctype html><html><body style="margin:0;background:#888"><iframe src="../index.html" style="width:390px;height:7600px;border:0;display:block;background:#fff"></iframe>
<script>const f=document.querySelector('iframe');f.onload=()=>{const d=f.contentDocument;document.title='scrollW='+d.documentElement.scrollWidth+' clientW='+d.documentElement.clientWidth;const w=[...d.querySelectorAll('body *')].filter(e=>e.getBoundingClientRect().right>391).map(e=>e.tagName+'.'+e.className).slice(0,8);document.body.insertAdjacentHTML('beforeend','<pre id=r>'+document.title+'\n'+w.join('\n')+'</pre>')}</script></body></html>
